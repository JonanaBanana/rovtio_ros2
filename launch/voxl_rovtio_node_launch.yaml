launch:
  - arg:
      name: filter_config
      default: "$(find-pkg-share rovtio)/cfg/rovtio/voxl_starling2_max/rovtio_custom.info"

  - arg:
      name: cam0_config
      default: "$(find-pkg-share rovtio)/cfg/rovtio/voxl_starling2_max/cam0_low_light.yaml"

  - arg:
      name: cam1_config
      default: "$(find-pkg-share rovtio)/cfg/rovtio/voxl_starling2_max/cam1_ircam.yaml"
  - arg:
      name: imu_topic
      default: "/imu_apps"
  - arg:
      name: cam0_topic
      default: "/low_light_down"
  - arg:
      name: cam1_topic
      default: "/ircam"
  - arg:
      name: resize_image
      default: "false"
  - arg:
      name: resize_image_width
      default: "320"
  - arg:
      name: resize_image_height
      default: "240"
  - arg:
      name: vis_fps
      default: "5"
  - node:
      pkg: rovtio
      exec: rovtio_node
      name: rovtio
      output: screen
      param:
        - name: filter_config
          value: "$(var filter_config)"
        - name: camera0_config
          value: "$(var cam0_config)"
        - name: camera1_config
          value: "$(var cam1_config)"
        - name: use_sim_time
          value: true
        - name: resize_image
          value: "$(var resize_image)"
        - name: resize_image_width
          value: "$(var resize_image_width)"
        - name: resize_image_height
          value: "$(var resize_image_height)"
        - name: vis_fps
          value: "$(var vis_fps)"
  - node:
      pkg: image_view
      exec: image_view
      name: rovtio_image_view
      remap:
        - from: image
          to: /rovtio/imgVis0

